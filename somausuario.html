<!DOCTYPE html>
<html lang="Soma JS">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma JS</title>
</head>

<body>
    <script>
        alert('O Programa executará as Operações (+ - * /) entre os numeros digitados')
        var num1 = parseInt(prompt("Digite 1 número: "));
        var num2 = parseInt(prompt("Digite outro número:"));

        // num1 = parseInt(num1);
        // num2 = parseInt(num2);
        var resultado = num1 + num2;
        alert("O resultado final da Soma é: " + resultado);
        var resultado2 = num1 - num2;
        alert("O resultado final da Subtração é: " + resultado2);
        var resultado3 = num1 * num2;
        alert("O resultado final da Multiplicação é: " + resultado3);
        var resultado4 = num1 / num2;
        alert("O resultado final da Divisão é: " + resultado4);
 
    </script>
</body>

</html>
